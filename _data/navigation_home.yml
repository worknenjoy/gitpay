# Three primary tasks on the documentation homepage.
- doc: service-provider
  icon: credit-card
  en:
    title: Get paid for work
    desc: Send a Payment Request to a customer after delivering work.
    action: Request a payment
  br:
    title: Receba pelo seu trabalho
    desc: Envie uma cobrança ao cliente depois de entregar o trabalho.
    action: Solicitar pagamento
- doc: contributor
  icon: git-fork
  en:
    title: Contribute to a project
    desc: Find a funded issue, deliver a Pull Request, and receive payment after acceptance.
    action: Explore contributions
  br:
    title: Contribua com um projeto
    desc: Encontre uma issue financiada, envie um Pull Request e receba após a aprovação.
    action: Explorar contribuições
- doc: sponsor
  icon: users
  en:
    title: Fund work on a project
    desc: Fund a GitHub issue, review the contribution, and release payment.
    action: Fund an issue
  br:
    title: Financie trabalho em um projeto
    desc: Financie uma issue do GitHub, revise a contribuição e libere o pagamento.
    action: Financiar uma issue
