# Three primary tasks on the documentation homepage.
- doc: getting-started-service-provider
  icon: credit-card
  en:
    title: Get paid for work
    desc: Create a payment link, send it to your customer, and get paid by card.
    action: Request a payment
  br:
    title: Receba pelo seu trabalho
    desc: Crie um link de pagamento, envie ao cliente e receba por cartão.
    action: Solicitar pagamento
- doc: getting-started-contributor
  icon: git-fork
  en:
    title: Contribute to a project
    desc: Find a funded issue, get your pull request merged, and get paid automatically.
    action: Explore contributions
  br:
    title: Contribua com um projeto
    desc: Encontre uma issue financiada, tenha seu pull request mesclado e receba automaticamente.
    action: Explorar contribuições
- doc: getting-started-sponsor
  icon: users
  en:
    title: Fund work on a project
    desc: Put a bounty on a GitHub issue. It's paid out only when a solution is merged.
    action: Fund an issue
  br:
    title: Financie trabalho em um projeto
    desc: Coloque uma recompensa em uma issue do GitHub. Ela só é paga quando uma solução é mesclada.
    action: Financiar uma issue
