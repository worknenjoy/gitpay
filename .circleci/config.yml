# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: "2.1"
jobs:
  build:
    docker:
    # specify the version you desire here
    - image: cimg/node:18.20.8
      environment:
        PG_HOST: 127.0.0.1
        POSTGRES_DB: gitpay_test
        POSTGRES_USER: postgres
        PG_PASSWD: postgres
        NODE_ENV: test
    - image: cimg/postgres:9.6
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: gitpay_test

    # Specify service dependencies here if necessary
    # CircleCI maintains a library of pre-built images
    # documented at https://circleci.com/docs/2.0/circleci-images/
    # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    steps:
      - checkout
      - run:
          name: install
          command: 'curl -k -O -L https://npmjs.org/install.sh | sh'
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install packages
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
          - node_modules
      #- run: sudo apt install postgresql-client
      - run:
          name: install dockerize
          command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
          environment:
            DOCKERIZE_VERSION: v0.3.0
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      #- run:
      #    name: Set up database
      #    command: psql -h localhost -p 5432 -c 'create database gitpay_test' -U postgres
      - run:
          name: Build
          command: npm run build
      - run:
          name: Migrate
          command: npm run migrate:test
      # run seed!
      - run:
          name: run node seeds
          command: npm run seed:test
          no_output_timeout: 60m
      # run tests!
      - run:
          name: run node tests
          command: npm run test
          no_output_timeout: 60m
      - run:
          name: install frontend dependencies
          command: npm install
          working_directory: frontend
      - run:
          name: run frontend tests
          command: npm run test:ci
          working_directory: frontend

  e2e:
    docker:
    # Own Postgres service on its own database (gitpay_e2e, via TEST_DB_NAME) so this job
    # can never race or collide with the `build` job's gitpay_test database — separate
    # containers per CircleCI job already isolate them, and the distinct name is belt-and-suspenders.
    - image: cimg/node:18.20.8
      environment:
        PG_HOST: 127.0.0.1
        POSTGRES_DB: gitpay_e2e
        POSTGRES_USER: postgres
        PG_PASSWD: postgres
        NODE_ENV: test
        TEST_DB_NAME: gitpay_e2e
    - image: cimg/postgres:9.6
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: gitpay_e2e

    working_directory: ~/repo

    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install backend packages
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
          - node_modules
      - run:
          name: Install frontend packages
          command: npm install
          working_directory: frontend
      - run:
          name: install dockerize
          command: wget https://github.com/jwilder/dockerize/releases/download/$DOCKERIZE_VERSION/dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && sudo tar -C /usr/local/bin -xzvf dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz && rm dockerize-linux-amd64-$DOCKERIZE_VERSION.tar.gz
          environment:
            DOCKERIZE_VERSION: v0.3.0
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Install Playwright browsers
          command: npx playwright install --with-deps chromium
      - run:
          name: Migrate e2e database
          command: npm run migrate:test:dev
      - run:
          name: run e2e tests
          command: npm run test:e2e
          no_output_timeout: 15m

workflows:
  version: 2
  build-all:
    jobs:
      - build:
          filters:
            branches:
              ignore: gh-pages
      - e2e:
          filters:
            branches:
              ignore: gh-pages
