version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-security:
        applies-to: security-updates
        patterns: ["*"]
      root-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
