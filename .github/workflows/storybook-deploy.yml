name: Deploy Storybook

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

# Back-to-back merges otherwise push to gh-pages at the same time and the loser fails.
# Each run builds from its own commit, so the newest run covers anything a cancelled one had.
concurrency:
  group: storybook-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/storybook-static
          publish_branch: gh-pages
          destination_dir: storybook
          keep_files: true
          enable_jekyll: true
